<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Icono de Claude Context Meter: medidor de consumo + cuadraditos de contexto (diseño propio) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26324a"/>
      <stop offset="1" stop-color="#151b29"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3794ff"/>
      <stop offset="0.65" stop-color="#4fc1a6"/>
      <stop offset="1" stop-color="#e5b53d"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>
  <!-- arco del medidor: pista y relleno (≈70 %) -->
  <path d="M 52 150 A 76 76 0 0 1 204 150" fill="none" stroke="#3a4660" stroke-width="22" stroke-linecap="round"/>
  <path d="M 52 150 A 76 76 0 0 1 181.7 96.3" fill="none" stroke="url(#arc)" stroke-width="22" stroke-linecap="round"/>
  <!-- aguja -->
  <line x1="128" y1="150" x2="170" y2="104" stroke="#f2f4f8" stroke-width="9" stroke-linecap="round"/>
  <circle cx="128" cy="150" r="13" fill="#f2f4f8"/>
  <!-- cuadraditos de contexto -->
  <g>
    <rect x="58"  y="186" width="18" height="18" rx="4" fill="#3794ff"/>
    <rect x="82"  y="186" width="18" height="18" rx="4" fill="#3794ff"/>
    <rect x="106" y="186" width="18" height="18" rx="4" fill="#3794ff"/>
    <rect x="130" y="186" width="18" height="18" rx="4" fill="#b180d7"/>
    <rect x="154" y="186" width="18" height="18" rx="4" fill="#3a4660"/>
    <rect x="178" y="186" width="18" height="18" rx="4" fill="#3a4660"/>
  </g>
</svg>
